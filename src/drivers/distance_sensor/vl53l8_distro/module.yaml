module_name: VL53L8 Distro Board (serial)
serial_config:
    - command: vl53l8_distro start -d ${SERIAL_DEV} -b p:${BAUD_PARAM}
      port_config_param:
        name: SENS_EN_VL_D_CFG
        group: Sensors
        default: TEL3
      num_instances: 1
      supports_networking: false

parameters:
    - group: Sensors
      definitions:
        VL_D_OUT_RES:
            description:
                short: Resolution of the outer VL53L8 sensor
                long: |
                    The VL53L8 sensor can operate at different resolutions, affecting the accuracy and range.
                    This set resolution for outward looking sensors.
            type: enum
            values:
                0: Board default
                16: 4x4
                64: 8x8
            reboot_required: true
            num_instances: 1
            default: 64

        VL_D_IN_RES:
            description:
                short: Resolution of the outer VL53L8 sensor
                long: |
                    The VL53L8 sensor can operate at different resolutions, affecting the accuracy and range.
                    This set resolution for inward looking sensors.
            type: enum
            values:
                0: Board default
                16: 4x4
                64: 8x8
            reboot_required: true
            num_instances: 1
            default: 64

        VL_D_OUT_FREQ:
            description:
                short: Ranging frequency of outward looking VL53L8 sensors
                long: |
                    The VL53L8 sensor can operate at different frequency, affecting the accuracy and range.
                    For 4x4 resolution, the valid range is 1-60 Hz.
                    For 8x8 resolution, the valid range is 1-15 Hz.
            type: int32
            min: 2
            max: 60
            unit: Hz
            reboot_required: true
            num_instances: 1
            default: 10

        VL_D_IN_FREQ:
            description:
                short: Ranging frequency of inward looking VL53L8 sensors
                long: |
                    The VL53L8 sensor can operate at different frequency, affecting the accuracy and range.
                    For 4x4 resolution, the valid range is 1-60 Hz.
                    For 8x8 resolution, the valid range is 1-15 Hz.
            type: int32
            min: 2
            max: 60
            unit: Hz
            reboot_required: true
            num_instances: 1
            default: 10

        VL_D_OUT_TARGET:
            description:
                short: Target order of the outer VL53L8 sensor
                long: |
                    The VL53L8 sensor can return ranging results for CLOSEST detected object or the STRONGEST returned signal from object.
                    This set resolution for outward looking sensors.
            type: enum
            values:
                0: Board default
                1: Closest
                2: Strongest
            reboot_required: true
            num_instances: 1
            default: 2

        VL_D_IN_TARGET:
            description:
                short: Target order of the inner VL53L8 sensor
                long: |
                    The VL53L8 sensor can return ranging results for CLOSEST detected object or the STRONGEST returned signal from object.
                    This set resolution for inward looking sensors.
            type: enum
            values:
                0: Board default
                1: Closest
                2: Strongest
            reboot_required: true
            num_instances: 1
            default: 2

        VL_D_${i}_ORIENT:
            description:
                short: Orientation of outward looking VL53L8 SENSOR ${i}
                long: |
                    Orientation of sensor connected to the connector ${i} on VL53L8 Distro board.
            type: enum
            values:
                0: YAW 0
                1: YAW 30
                2: YAW 60
                3: YAW 90
                4: YAW 120
                5: YAW 150
                6: YAW 180
                7: YAW 210
                8: YAW 240
                9: YAW 270
                10: YAW 300
                11: YAW 330
            reboot_required: true
            num_instances: 10
            instance_start: 1
            default: [1, 3, 5, 7, 9, 11, 0, 0, 0, 0]

        VL_D_L4_${i}_AXIS:
            description:
                short: Axis orientation of VL53L4 SENSOR ${i} in FRD frame
                long: |
                    Axis orientation of VL53L4 sensor connected to the connector ${i} on VL53L8 Distro board.
            type: enum
            values:
                0: X axis
                1: Y axis
                255: Unknown
            reboot_required: true
            num_instances: 2
            instance_start: 9
            default: [0, 1]

        VL_D_L4_OFF_X:
            description:
                short: Sensor calibration offset for VL53L4 sensor in X axis
                long: |
                    Sensor calibration offset for VL53L4 sensor in X axis in millimeters.
                    Value should be calculated with calibration procedure with given distance.
            type: int32
            min: -1000
            max: 1000
            unit: mm
            reboot_required: true
            num_instances: 1
            default: -10

        VL_D_L4_OFF_Y:
            description:
                short: Sensor calibration offset for VL53L4 sensor in Y axis
                long: |
                    Sensor calibration offset for VL53L4 sensor in Y axis in millimeters.
                    Value should be calculated with calibration procedure with given distance.
            type: int32
            min: -1000
            max: 1000
            unit: mm
            reboot_required: true
            num_instances: 1
            default: -14

        VL_D_L4_RNGTIME:
            description:
                short: Sensor L4 ranging time budget in ms
                long: |
                    Sensor ranging time budget for VL53L4 sensor in milliseconds. Minimum is 10 ms. Higher time budget increases accuracy.
            type: int32
            min: 10
            max: 200
            unit: ms
            reboot_required: true
            num_instances: 1
            default: 20

        VL_TKF_OUT_RATE:
            description:
                short: Output rate of trolley Kalman filter
                long: |
                    Output rate of trolley Kalman filter in milliseconds.
            type: int32
            min: 20
            max: 1000
            unit: ms
            reboot_required: true
            num_instances: 1
            default: 100

        VL_TKF_X_CTR_OFF:
            description:
                short: Sensor offset for centrering trolley in X axis
                long: |
                    Sensor offset for centrering trolley in X axis in millimeters.
            type: int32
            min: 0
            max: 120
            unit: mm
            reboot_required: true
            num_instances: 1
            default: 61

        VL_TKF_Y_CTR_OFF:
            description:
                short: Sensor offset for centrering trolley in Y axis
                long: |
                    Sensor offset for centrering trolley in Y axis in millimeters.
            type: int32
            min: 0
            max: 120
            unit: mm
            reboot_required: true
            num_instances: 1
            default: 62

        VL_TKF_COG_LEVER:
            description:
                short: Distance from COG to the trolley plane in meters
                long: |
                    Distance from COG to the trolley plane in meters. In FRD frame.
            type: float
            min: -0.50
            max: 0.50
            unit: m
            reboot_required: true
            num_instances: 1
            default: 0.05

        VL_TKF_Q_NOISE:
            description:
                short: Process noise for trolley Kalman filter
                long: |
                    Process noise for trolley Kalman filter in m/s^2 -> Q.
            type: float
            min: 0
            max: 5
            unit: m/s^2
            reboot_required: true
            num_instances: 1
            default: 0.6

        VL_TKF_MIN_SIGMA:
            description:
                short: Minimum measurment sigma
                long: |
                    Minimum measurment sigma for Kalman filter in m -> R.
            type: float
            min: 0
            max: 5
            unit: m
            reboot_required: true
            num_instances: 1
            default: 0.005

        VL_TKF_USE_NGATE:
            description:
                short: Use NIS GATE for trolley Kalman filter
                long: |
                    Use NIS GATE for trolley Kalman filter.
            type: boolean
            reboot_required: true
            num_instances: 1
            default: true

        VL_TKF_NGATE_THR:
            description:
                short: NIS GATE threshold for trolley Kalman filter
                long: |
                    NIS GATE threshold for trolley Kalman filter.
            type: float
            min: 0
            max: 81.0
            reboot_required: true
            num_instances: 1
            default: 16.0

        VL_TKF_USE_SIGDG:
            description:
                short: Use signal degrade for trolley Kalman filter
                long: |
                    Use signal degrade for trolley Kalman filter.
            type: boolean
            reboot_required: true
            num_instances: 1
            default: true

        VL_TKF_SD_FACTOR:
            description:
                short: Signal degradation factor for trolley Kalman filter
                long: |
                    Signal degradation factor for trolley Kalman filter.
            type: float
            min: 1
            max: 100
            unit: m
            reboot_required: true
            num_instances: 1
            default: 4.0
