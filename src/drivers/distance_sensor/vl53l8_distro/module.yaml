module_name: VL53L8 Distro Board (serial)
serial_config:
    - command: vl53l8_distro start -d ${SERIAL_DEV} -b p:${BAUD_PARAM}
      port_config_param:
        name: SENS_EN_VL_D_CFG
        group: Sensors
        default: TEL3
      num_instances: 1
      supports_networking: false

parameters:
    - group: Sensors
      definitions:
        VL_DISTRO_RES:
            description:
                short: Resolution of the VL53L8 sensor
                long: |
                    The VL53L8 sensor can operate at different resolutions, affecting the accuracy and range.
            type: enum
            values:
                16: 4x4
                64: 8x8
            reboot_required: true
            num_instances: 1
            default: 64

        VL_D_1_ORIENT:
            description:
                short: Orientation of VL53L8 SENSOR 1
                long: |
                    Orientation of sensor connected to the connector 1 on VL53L8 Distro board.
            type: enum
            values:
                0: YAW 0
                1: YAW 30
                2: YAW 60
                3: YAW 90
                4: YAW 120
                5: YAW 150
                6: YAW 180
                7: YAW 210
                8: YAW 240
                9: YAW 270
                10: YAW 300
                11: YAW 330
            reboot_required: true
            num_instances: 1
            default: 1

